#textdomain fiery-birth
[scenario]
    id=05_Tartarus
    name=_ "Tartarus"
    map_data="{~/add-ons/A_Fiery_Birth/maps/05_Tartarus.map}"
#ifdef EASY
    turns=35
#else
    turns=30
#endif
    next_scenario=06_Alone_Again

    {DEFAULT_SCHEDULE_DAWN}

    {SCENARIO_MUSIC       into-the-shadows.ogg}
    {EXTRA_SCENARIO_MUSIC battle.ogg}

    [story]
        [part]
            music=revelation.ogg
            story=_ "With the mages gone and their servants scattered, the Drakes took command of the land. But something was amiss; the game-filled forests they had previously enjoyed now grew gaunt and bare. The fields blackened, cursed by some unknown power."
            background=story/landscape-hills-01.jpg
        [/part]
        [part]
            music=revelation.ogg
            story=_ "With Menir's help, the Saurian Szel searched the books of the ruined towers. It detailed the construction of an elaborate prison for powerful creatures, high in the mountains. These creatures, who once haunted these regions, had been contained for study by the zealous researchers. Without their magic to sustain the barriers, the prison had begun to fail, and dark curses were flowing from the unholy peak."
            background=story/landscape-hills-01.jpg
        [/part]
        [part]
            story=_ "Determined to contain this evil before it destroyed their new-found home, the Drakes took to battle."
            background=story/landscape-hills-01.jpg
        [/part]
    [/story]

    # wmllint: validate-off

    [side]
        side=1
        controller=human
        shroud=yes
        recruit=Saurian Skirmisher, Saurian Augur, Drake Burner, Drake Glider, Drake Clasher, Drake Fighter
        gold=200
        team_name=good
        user_team_name= _ "Scaly Folk"
        {FLAG_VARIANT undead}

        type=Drake Burner
        id=Menir
        name= _ "Menir"
        canrecruit=yes

        facing=ne
    [/side]

    [side]
        side=2
        controller=ai
        team_name=evil
        user_team_name= _ "Mages"
        {FLAG_VARIANT undead}

#ifdef EASY
        type=Necromancer
#endif
#ifdef NORMAL
        type=Lich
#endif
#ifdef HARD
        type=Ancient Lich
#endif
        id=Mal_Shikan
        name= _ "Mal Shikan"
        canrecruit=no
        defeat_condition=no_units_left

        facing=se

        [ai]
            aggression=1.0
            passive_leader=no
        [/ai]
    [/side]
    # wmllint: validate-on

    [side]
        side=3
        controller=ai
        team_name=evil
        defeat_condition=no_units_left
        user_team_name= _ "Mages"
        {FLAG_VARIANT undead}

#ifdef EASY
        type=Silver Mage
#else
        type=Elder Mage
#endif
        id=Mannis
        name= _ "Mannis"
        canrecruit=no

        facing=se

        [ai]
            aggression=1.0
            passive_leader=no
        [/ai]
    [/side]

    [side]
        side=4
        controller=ai
        team_name=evil
        defeat_condition=no_units_left
        user_team_name= _ "Mages"
        {FLAG_VARIANT undead}

#ifdef EASY
        type=Dwarvish Runemaster
#else
        type=Dwarvish Arcanister
#endif
        id=Thurlen
        name= _ "Thurlen"
        canrecruit=no

        facing=se

        [ai]
            aggression=1.0
            passive_leader=no
        [/ai]
    [/side]

    [side]
        side=5
        controller=ai
        team_name=evil
        defeat_condition=no_units_left
        user_team_name= _ "Mages"
        {FLAG_VARIANT undead}

#ifdef EASY
        type=Elder Mage
#else
        type=Great Mage
#endif
        id=Crasich
        name= _ "Crasich"
        canrecruit=no

        facing=se

        [ai]
            aggression=1.0
            passive_leader=no
        [/ai]
    [/side]

    [side]
        side=6
        controller=ai
        team_name=evil
        user_team_name= _ "Mages"
        defeat_condition=no_units_left
        {FLAG_VARIANT undead}

#ifdef Hard
        type=Ancient Lich
#else
        type=Lich
#endif
        id=Mal_Ufer
        name= _ "Mal Ufer"
        canrecruit=no

        facing=se

        [ai]
            aggression=1.0
            passive_leader=no
        [/ai]
    [/side]

    [side]
        side=7
        controller=ai
        team_name=evil
        defeat_condition=no_units_left
        user_team_name= _ "Mages"
        {FLAG_VARIANT undead}

#ifdef EASY
        type=Deathblade
#endif
#ifdef NORMAL
        type=Death Knight
#endif
#ifdef HARD
        type=Skeletal Dragon
#endif
        id=Stonefield2
        name= _ "Stonefield"
        canrecruit=no

        facing=se

        [ai]
            aggression=1.0
            passive_leader=no
        [/ai]
    [/side]

    [side]
        side=8
        controller=ai
        team_name=evil
        defeat_condition=no_units_left
        user_team_name= _ "Mages"
        {FLAG_VARIANT undead}

#ifdef EASY
        type=Great Troll
#else
        type=Yeti
#endif
        id=Hak_Long
        name= _ "Hak Long"
        canrecruit=no

        facing=se

        [ai]
            aggression=1.0
            passive_leader=no
        [/ai]
    [/side]

    [event]
        name=prestart

        [objectives]
            side=1
            [objective]
                description= _ "Defeat all magical prisoners."
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Menir"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Szel"
                condition=lose
            [/objective]

            {TURNS_RUN_OUT}

            [gold_carryover]
                bonus=yes
                carryover_percentage=40
            [/gold_carryover]
        [/objectives]
    [/event]

    [event]
        name=start

        [recall]
            id=Szel
        [/recall]

        [message]
            speaker=Menir
            message= _ "It is cold here, Szel."
        [/message]

        [message]
            speaker=Szel
            message= _ "And these peaks are far apart. I fear that I can go no further. Only those who fly can move on from here."
        [/message]
        [message]
            speaker=Menir
            message= _ "Will you go back down?"
        [/message]

        [message]
            speaker=Szel
            message= _ "I will watch from the sides. Return to me if you are injured. And good luck."
        [/message]
 
        [message]
            speaker=narrator
            image="wesnoth-icon.png"
            message= _ "This scenario was originally intended to be fought with only flying units, and features disconnected islands. You may play it as originally intended, or add bridges between islands. These bridges will also make it easier for the powerful enemies to swarm you."
			[option]
				message = _ "Play the scenario as originally intended."
			[/option]
			[option]
				message = _ "Add bridges so all units can fight."
				[command]
					[message]
						speaker=Szel
						message= _ "Wait. I believe there is an enchantment at work here Let me see... Aha!"
					[/message]
				[/command]
				[command]
						[replace_map]
						map_file=05_TartarusAlt.map
						[/replace_map]
				[/command]
				[command]
					[message]
						speaker=Szel
						message= _ "These bridges were hidden from our view! Now we will be able to join you in your fight."
					[/message]
				[/command]
				[command]
					[message]
						speaker=Menir
						message= _ "Incredible!"
					[/message]
				[/command]
			[/option]
        [/message]

 [/event]

    [event]
        name=sighted
        [filter]
            id=Mal_Shikan
        [/filter]

        [message]
            speaker=Mal_Shikan
            message= _ "So those idiot mages have been defeated. Foolish, mortal cowards. You'll suffer the consequences of their actions."
        [/message]
    [/event]

    [event]
        name=sighted
        [filter]
            id=Mannis
        [/filter]

        [message]
            speaker=Mannis
            message= _ "Finally! I sense someone who is not undead. Listen, you must get me out of here."
        [/message]

        [message]
            speaker=Menir
            message= _ "Well met, wanderer. We would be pleased to off you our protection."
        [/message]

        [message]
            speaker=Mannis
            message= _ "Very well, you-- What are you? You're not humans! You're some kind of deformed monsters! You disgusting freaks--I suppose you finally defeated the mages. Stay back, or I'll slay you all!"
        [/message]

        [message]
            speaker=Menir
            message= _ "I am sorry. Sorry that you are filled with hatred. And sorry that I cannot let you live after threatening my people!"
        [/message]
    [/event]

    [event]
        name=sighted
        [filter]
            id=Thurlen
        [/filter]

        [message]
            speaker=Thurlen
            message= _ "Ach, what's this? A flock of wee dragons? I've faced far worse than the likes of ye. Come nae closer, or you'll feel my hammer!"
        [/message]
    [/event]

    [event]
        name=sighted
        [filter]
            id=Crasich
        [/filter]

        [message]
            speaker=Crasich
            message= _ "So it comes to this. Imprisoned in my own trap, betrayed by the Two Towers, and condemned to listen to that horrible dwarf for decades. And now am I to be murdered by a band of vicious, mindless lizards."
        [/message]

        [message]
            speaker=Menir
            message= _ "Is everyone here as arrogant as you? You deserve your fate."
        [/message]
    [/event]

    [event]
        name=sighted
        [filter]
            id=Stonefield2
        [/filter]

#ifdef	HARD
        [message]
            speaker=Stonefield2
            message= _ "..."
        [/message]

        [message]
            speaker=Szel
            message= _ "It can't be...who would have done this?"
        [/message]
        [message]
            speaker=Menir
            message= _ "Mother? No...something else. Older. This is disgusting."
        [/message]

#else
        [message]
            speaker=Stonefield2
            message= _ "Fresh meat. Warm blood."
        [/message]
#endif
    [/event]

    [event]
        name=enemies defeated
        [message]
            speaker=Szel
            message= _ "It is done."
        [/message]
        [message]
            speaker=Menir
            message= _ "There can be nothing left. We have cleansed this realm from the curse of these mountains."
        [/message]
        [message]
            speaker=Szel
            message= _ "Perhaps."
        [/message]
        [message]
            speaker=Menir
            message= _ "Szel?"
        [/message]
        [message]
            speaker=Szel
            message= _ "I am uneasy. Let us return below."
        [/message]
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]
    [/event]

    [event]
        name=victory

        message= _ "This is the victory message."
    [/event]

    [event]
        name=last breath
        [filter]
            id=Szel
        [/filter]

        [message]
            speaker=Szel
            message= _ "We have perished!"
        [/message]

        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=last breath
        [filter]
            id=Menir
        [/filter]

        [message]
            speaker=Menir
            message= _ "Just like mother..."
        [/message]

        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=sighted
        [filter]
            id=Mal_Ufer
        [/filter]

        [message]
            speaker=Mal_Ufer
            message= _ "Hmm? What's this? Another interruption to my experiments? Come another day, little gnats. Unless you wish to taste the beauty of everlasting life. Your bodies could provide boundless energy."
        [/message]
    [/event]

    [event]
        name=sighted
        [filter]
            id=Hak_Long
        [/filter]

        [message]
            speaker=Hak_Long
            message= _ "Gralg! Aghh!" # wmllint: no spellcheck
        [/message]

        [message]
            speaker=Menir
            message= _ "A long imprisonment has driven this creature mad."
        [/message]
    [/event]

#ifdef HARD
    [event]
        name=turn 10

        [unit]
            side=2
            type=Fire Dragon
            id=Shaxal
            name= _ "Shaxal"
            canrecruit=yes
            x,y=1,1
            unrenamable=yes
        [/unit]

        {MOVE_UNIT (id=Shaxal) 15 15}
        [message]
            speaker=Menir
            message= _ "I smell something incredibly foul on the wind...I fear that they have enslaved one of our kind."
        [/message]
    [/event]

#endif

    [event]
        name=time over

        [message]
            speaker=Menir
            message= _ "The chill air is overcoming us. We have been here too long; there is something foul in this cold."
        [/message]
    [/event]
[/scenario]
