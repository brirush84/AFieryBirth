#textdomain fiery-birth
[scenario]
    id=03_Creatures_Of_Fae
    name=_ "Creatures of Fae"
    map_data="{~/add-ons/A_Fiery_Birth/maps/03_Creatures_Of_Fae.map}"
    {TURNS 36 32 30}
    next_scenario=04_Hidden_Towers

    {DEFAULT_SCHEDULE_DAWN}

    {SCENARIO_MUSIC       elvish-theme.ogg}
    {EXTRA_SCENARIO_MUSIC elf-land.ogg}
    {EXTRA_SCENARIO_MUSIC siege_of_laurelmor.ogg}

    [story]
        [part]
            music=revelation.ogg
            story=_ "The drakes and saurians travelled across the land, passing caravans of humans, elves and dwarves, all fleeing the great war between the rulers of the dead.
			
The humans and elves feared the unfamiliar forms of the drakes, but the dwarves were delighted with their fiery breath. (This was in the old days, before the drakes and dwarves parted ways.) Menir allowed their smiths and sages to study them, while the dwarves taught them the way of metal and iron-craft."
            background=story/landscape-plain.jpg
        [/part]
        [part]
            story=_ "With new weapons and armor, the drakes were easily able to fend off the fringes of the undead armies. Eschewing farms and settlements, they hunted game, following herds across the plains. As the war continued, though, the animals dwindled. Soon the only animals left were those in the forests of the elves."
            background=story/landscape-plain.jpg
        [/part]
        [part]
            story=_ "Menir sent messengers to the elves, asking for permission to hunt, but the messengers were only met with arrows and insults. Refusing to let his people starve, Menir set up hunting camps to to find creatures and preserve their meat for the days ahead. When the elves learned of this, they were furious."
            background=story/landscape-hills-01.jpg
        [/part]
    [/story]

    # wmllint: validate-off

    [side]
        side=1
        controller=human
        recruit=Saurian Skirmisher, Saurian Augur, Drake Burner, Drake Glider, Drake Clasher, Drake Fighter
        {GOLD 200 175 150}
        {INCOME 3 2 1}
        team_name=good
        user_team_name= _ "Scaly Folk"
        {FLAG_VARIANT undead}

        type=Drake Burner
        id=Menir
        name= _ "Menir"
        canrecruit=yes

        facing=nw
    [/side]

    [side]
        side=2
        controller=ai
#ifdef EASY
        recruit=Elvish Archer, Wose, Elvish Shaman, Elvish Druid
#endif
#ifdef NORMAL
        recruit=Elvish Archer, Elvish Scout, Elvish Druid
#endif
#ifdef HARD
        recruit=Elvish Archer, Elvish Scout, Elvish Ranger
#endif

        {GOLD 100 125 150}
        team_name=evil
        user_team_name= _ "Elves"
        {FLAG_VARIANT wood-elvish}

#ifdef EASY
        type=Elvish Druid
#else
        type=Elvish Shyde
#endif
        id=Nevis
        name= _ "Nevis"
        canrecruit=yes

        facing=se

        [ai]
            grouping=yes
            passive_leader=no
        [/ai]
    [/side]
    # wmllint: validate-on

    [side]
        side=3
        controller=ai
		caution=.35
#ifdef EASY
        gold=100
        recruit=Elvish Shaman, Elvish Fighter, Elvish Sorceress
#endif
#ifdef NORMAL
        gold=150
        recruit=Elvish Scout, Elvish Fighter, Elvish Sorceress
#endif
#ifdef HARD
        gold=200
        recruit=Elvish Rider, Elvish Hero, Elvish Sorceress
#endif
        team_name=evil
        user_team_name= _ "Elves"
        {FLAG_VARIANT wood-elvish}

#ifdef EASY
        type=Elvish Sorceress
#else
        type=Elvish Enchantress
#endif
        id=Kitt
        name= _ "Kitt"
        canrecruit=yes

        facing=se

        [ai]
            grouping=yes
            passive_leader=no
        [/ai]
    [/side]

    [event]
        name=prestart

        [objectives]
            side=1
            [objective]
                description= _ "Kill all 5 boar."
                condition=win
            [/objective]
            [objective]
                description= _ "Alternative Objective: Defeat both enemy leaders."
                condition=win
            [/objective]
            [objective]
                description= _ "Death of Menir"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Szel"
                condition=lose
            [/objective]

            {TURNS_RUN_OUT}

            [gold_carryover]
                bonus=yes
                carryover_percentage=40
            [/gold_carryover]
        [/objectives]
		{LOYAL_UNIT 3 {ON_DIFFICULTY "Piglet" "Woodland Boar" "Woodland Boar"} 10 18}
		{LOYAL_UNIT 3 {ON_DIFFICULTY "Piglet" "Woodland Boar" "Woodland Boar"} 19 29}
		{LOYAL_UNIT 3 {ON_DIFFICULTY "Piglet" "Woodland Boar" "Woodland Boar"} 21 23}
		{LOYAL_UNIT 3 {ON_DIFFICULTY "Piglet" "Woodland Boar" "Woodland Boar"} 8 18}
		{LOYAL_UNIT 3 {ON_DIFFICULTY "Piglet" "Woodland Boar" "Woodland Boar"} 2 11}
        [micro_ai]
            side=3
            ai_type=forest_animals
            action=add

            tusker_type=Woodland Boar, Piglet
       [/micro_ai]
	   	[set_variable]
		name=boardead
		value=0
 	[/set_variable]
    [/event]
	[event]
		name=side 1 turn 1
		[object]
			[filter]
				id=Szel
			[/filter]
			duration=turn #72 pixel more for another image
			image="misc/blank-hex.png~SCALE(72,220)~BLIT(units/drakes/clasher.png~RC(magenta>red),0,50)~BLIT(units/drakes/fighter.png~RC(magenta>red),0,135)"
			name=_"New Recruits:"
			description=_"
Fighters are balanced units with high melee damage and decent ranged attacks. Their high movement helps them outmaneuver their opponents.

Clashers are tough melee-only units without the weakness to pierce that other drakes have. Their first-strike ability makes them a good defense against horsemen."
		[/object]
	[/event]

    [event]
        name=start

        [recall]
            id=Szel
        [/recall]

        [message]
            speaker=Menir
            message= _ "Szel, how's the jerky coming along? Will we have enough for the winter?"
        [/message]

        [message]
            speaker=Szel
            message= _ "We'll need at least five more of those large boar to be safe."
        [/message]

        [message]
            speaker=Menir
            message= _ "Five? That's quite easy. I could hunt them myself."
        [/message]

        [message]
            speaker=Nevis
            message= _ "Do you see, Kitt? These poaching lizards have desecrated the forest."
        [/message]

        [message]
            speaker=Kitt
            message= _ "Who could miss them, Nevis, thundering through the woods like mammoths."
        [/message]

        [message]
            speaker=Nevis
            message= _ "We will quench their fire, Kitt."
        [/message]

        [message]
            speaker=Kitt
            message= _ "They cannot be allowed to live and multiply, Nevis."
        [/message]

        [message]
            speaker=Menir
            message= _ "You can not deny us the right to exist, witch women!  We only desire to take what we need to survive. Did you not receive our missives?"
        [/message]

        [message]
            speaker=Kitt
            message= _ "If a flea could speak and beg, would you let it feed on your dog? No. You are parasites on nature. The world will be better with your death."
        [/message]

        [message]
            speaker=Menir
            message= _ "Then war it is. Your blood will water this ground!"
        [/message]
    [/event]

    [event]
        name=enemies defeated
        [endlevel]
            result=victory
            bonus=yes
            {NEW_GOLD_CARRYOVER 40}
        [/endlevel]

         [message]
            speaker=Menir
            message= _ "The dead roam the fields and the elves haunt the woods. It seems we cannot escape our enemies. If we cannot live, then we should die fighting, and burn these forests to the ground!"
        [/message]
 
 [message]
            speaker=Szel
            message= _ "Menir, if it was just my old bones that we would lose, I would fight, but your life is precious to me.  Before we lose all hope, let us travel just one more time, far from here. If we find a home, then we will live. If not, then I am happy to die by your side."
        [/message]

        [message]
            speaker=Menir
            message= _ "Very well, Szel. Let us leave here."
        [/message]
    [/event]

    [event]
        name=last breath
        [filter]
            id=Kitt
        [/filter]

        [message]
            speaker=Nevis
            message= _ "Sister! You will be avenged."
        [/message]

        [kill]
            id=Kitt
            animate=yes
        [/kill]
    [/event]

    [event]
        name=last breath
        [filter]
            id=Nevis
        [/filter]

        [message]
            speaker=Kitt
            message= _ "You have doomed yourselves. Our people will avenge us to the very last elf!"
        [/message]

        [kill]
            id=Nevis
            animate=yes
        [/kill]
    [/event]

    [event]
        name=victory

        message= _ "This is the victory message."
    [/event]

    [event]
        name=last breath
        [filter]
            id=Szel
        [/filter]

        [message]
            speaker=Szel
            message= _ "We have perished!"
        [/message]

        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=last breath
        [filter]
            id=Menir
        [/filter]

        [message]
            speaker=Menir
            message= _ "Just like mother..."
        [/message]

        [endlevel]
            result=defeat
        [/endlevel]
    [/event]
 [event]
        name=last breath
        first_time_only=no
        [filter]
            type=Woodland Boar,Piglet
        [/filter]
        
        [set_variable]
            name=boardead
            add=1
        [/set_variable]
        
        [if]
            [variable]
                name=boardead
                equals=1
            [/variable]
            [then]
                [message]
                    speaker=Menir
                    message= _ "Good, good, we'll need plenty of meat."
                [/message]
            [/then]
        [/if]
		
        [if]
            [variable]
                name=boardead
                equals=5
            [/variable]
            [then]
                 [message]
                    speaker=Szel
                    message= _ "Enough! It is enough. Come Menir, let us leave these unwelcoming lands behind."
                [/message]
                [endlevel]
                    result=victory
                    bonus=yes
                    {NEW_GOLD_CARRYOVER 40}
                [/endlevel]
            [/then]
        [/if]
    [/event]
	
    [event]
        name=time over

        [message]
            speaker=Szel
            message= _ "We will perish from hunger, Menir!"
        [/message]
    [/event]
[/scenario]
